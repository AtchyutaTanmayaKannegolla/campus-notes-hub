<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Notes Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-top: 0.4rem; margin-bottom: 0.4rem; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.5rem; margin-top: 0.4rem; margin-bottom: 0.4rem; }
        .markdown-body p { margin-bottom: 0.5rem; }
        .markdown-body pre { background: #1e293b; color: #f8fafc; padding: 0.75rem; border-radius: 0.5rem; overflow-x: auto; margin: 0.5rem 0; font-size: 0.82rem; }
        .markdown-body code { background: #e2e8f0; color: #0f172a; padding: 0.1rem 0.3rem; border-radius: 0.25rem; font-size: 0.82rem; }
        .markdown-body pre code { background: transparent; color: inherit; padding: 0; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: 700; margin-top: 0.65rem; margin-bottom: 0.35rem; color: #1e293b; }
        .markdown-body table { width: 100%; border-collapse: collapse; margin: 0.65rem 0; font-size: 0.8rem; background: #fff; }
        .markdown-body th, .markdown-body td { border: 1px solid #cbd5e1; padding: 0.45rem 0.55rem; text-align: left; vertical-align: top; }
        .markdown-body th { background: #f1f5f9; font-weight: 600; color: #334155; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between gap-4">
            <div class="flex items-center gap-2.5 cursor-pointer" onclick="exitFolder()">
                <span class="text-2xl">📚</span>
                <h1 class="text-xl font-bold text-slate-900 tracking-tight">Campus Notes Hub</h1>
            </div>
            <button onclick="openUploadModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2 rounded-xl text-sm shadow-sm transition flex items-center gap-1.5">
                <span>+</span> Upload Material
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-5 py-7 w-full flex-1">
        <!-- Search & Filter Bar -->
        <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200 mb-6 flex flex-col sm:flex-row gap-3">
            <input type="text" id="searchInput" oninput="renderCurrentView()" placeholder="Search folders, subjects, or unit titles..."
                class="flex-1 px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
            <select id="semesterFilter" onchange="renderCurrentView()"
                class="px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="ALL">All Semesters</option>
                <option value="1">Sem 1</option>
                <option value="2">Sem 2</option>
                <option value="3">Sem 3</option>
                <option value="4">Sem 4</option>
                <option value="5">Sem 5</option>
                <option value="6">Sem 6</option>
                <option value="7">Sem 7</option>
                <option value="8">Sem 8</option>
            </select>
        </div>

        <!-- Folder Breadcrumb Bar -->
        <div id="folderBreadcrumb" class="hidden items-center justify-between bg-white px-4 py-3 rounded-2xl border border-slate-200 shadow-sm mb-5">
            <div class="flex items-center gap-3">
                <button onclick="exitFolder()"
                    class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3.5 py-1.5 rounded-xl text-xs transition flex items-center gap-1.5">
                    <span>&larr;</span> Back to Folders
                </button>
                <div class="flex items-center gap-2 text-sm">
                    <span class="text-slate-400">Folders /</span>
                    <span id="activeFolderTitle" class="font-bold text-slate-900 uppercase"></span>
                </div>
            </div>
            <span id="activeFolderCount" class="text-xs font-semibold text-indigo-700 bg-indigo-50 px-2.5 py-1 rounded-lg"></span>
        </div>

        <!-- Folders / Notes Grid -->
        <div id="notesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <div class="col-span-full text-center py-12 text-slate-400 text-sm">Loading folders...</div>
        </div>
    </main>

    <!-- Floating Bottom-Right StudyBot Toggle Button -->
    <button onclick="toggleStudyBot()"
        class="fixed bottom-5 right-5 z-40 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-3 rounded-full shadow-lg transition flex items-center gap-2 text-sm">
        <span>🤖</span> Ask StudyBot
    </button>

    <!-- Docked Bottom-Right Campus StudyBot Window -->
    <div id="studyBotDrawer"
        class="fixed bottom-20 right-5 z-50 w-[370px] max-w-[calc(100vw-2.5rem)] bg-white rounded-2xl shadow-2xl border border-slate-200 hidden flex-col overflow-hidden"
        style="height: 510px;">
        <div class="bg-indigo-600 text-white px-4 py-3.5 flex items-center justify-between">
            <h2 class="font-semibold text-base tracking-tight">Campus StudyBot</h2>
            <button onclick="toggleStudyBot()" class="text-white/80 hover:text-white text-xl leading-none font-bold">&times;</button>
        </div>

        <div id="botChatHistory" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50/70">
            <div class="bg-white border border-slate-200 rounded-xl p-3.5 text-sm text-slate-600 shadow-sm">
                Hi! Ask me any study question, concept, or coding problem.
            </div>
        </div>

        <div class="p-3 bg-white border-t border-slate-200">
            <form onsubmit="handleBotAsk(event)" class="flex items-center gap-2">
                <input type="text" id="botQuestionInput" placeholder="Ask a study question..."
                    class="flex-1 px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                <button type="submit" id="botAskBtn"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2 rounded-xl text-sm transition">
                    Send
                </button>
            </form>
        </div>
    </div>

    <!-- Upload Modal -->
    <div id="uploadModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-slate-900">Upload Academic Material</h2>
                <button onclick="closeUploadModal()" class="text-slate-400 hover:text-slate-600 text-xl">&times;</button>
            </div>
            <form id="uploadForm" onsubmit="handleUpload(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Unit / Document Title</label>
                    <input type="text" name="title" required placeholder="e.g., Unit 1 - Automata Theory"
                        class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Folder / Subject</label>
                        <input type="text" id="uploadSubjectInput" name="subject" list="existingFoldersList" required placeholder="e.g., FLAT or Previous Year Papers"
                            class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <datalist id="existingFoldersList"></datalist>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Semester</label>
                        <select name="semester" required
                            class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="" disabled selected>Select Sem</option>
                            <option value="1">Sem 1</option>
                            <option value="2">Sem 2</option>
                            <option value="3">Sem 3</option>
                            <option value="4">Sem 4</option>
                            <option value="5">Sem 5</option>
                            <option value="6">Sem 6</option>
                            <option value="7">Sem 7</option>
                            <option value="8">Sem 8</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Category</label>
                    <select name="category" required
                        class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="NOTES">Notes</option>
                        <option value="QUESTION PAPER">Question Paper</option>
                        <option value="LAB MANUAL">Lab Manual</option>
                        <option value="ASSIGNMENT">Assignment</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">PDF Document</label>
                    <input type="file" name="file" accept="application/pdf" required
                        class="w-full text-sm text-slate-600 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Admin Passkey</label>
                    <input type="password" name="admin_key" required placeholder="Enter upload passkey"
                        class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div id="uploadStatus" class="text-xs text-red-600 hidden"></div>
                <button type="submit" id="uploadSubmitBtn"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-sm">
                    Upload PDF
                </button>
            </form>
        </div>
    </div>

    <!-- Edit Metadata Modal -->
    <div id="editModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-slate-900">Edit Material Details</h2>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 text-xl">&times;</button>
            </div>
            <form id="editForm" onsubmit="handleEditSubmit(event)" class="space-y-4">
                <input type="hidden" id="editNoteId">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Unit / Document Title</label>
                    <input type="text" id="editTitle" required
                        class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Folder / Subject</label>
                        <input type="text" id="editSubject" list="existingFoldersList" required
                            class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Semester</label>
                        <select id="editSemester" required
                            class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="1">Sem 1</option>
                            <option value="2">Sem 2</option>
                            <option value="3">Sem 3</option>
                            <option value="4">Sem 4</option>
                            <option value="5">Sem 5</option>
                            <option value="6">Sem 6</option>
                            <option value="7">Sem 7</option>
                            <option value="8">Sem 8</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Category</label>
                    <select id="editCategory" required
                        class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="NOTES">Notes</option>
                        <option value="QUESTION PAPER">Question Paper</option>
                        <option value="LAB MANUAL">Lab Manual</option>
                        <option value="ASSIGNMENT">Assignment</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Admin Passkey</label>
                    <input type="password" id="editAdminKey" required placeholder="Enter admin passkey to save changes"
                        class="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div id="editStatus" class="text-xs text-red-600 hidden"></div>
                <div class="flex gap-2.5 pt-1">
                    <button type="button" onclick="closeEditModal()"
                        class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2.5 rounded-xl text-sm transition">
                        Cancel
                    </button>
                    <button type="submit" id="editSubmitBtn"
                        class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-sm">
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Document AI Modal ("Ask AI About This PDF") -->
    <div id="docAiModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full flex flex-col max-h-[85vh] shadow-xl border border-slate-100 overflow-hidden">
            <div class="bg-indigo-600 text-white px-6 py-4 flex justify-between items-center">
                <div>
                    <h2 id="docAiTitle" class="text-base font-bold">Ask AI About This PDF</h2>
                    <p class="text-xs text-indigo-100">Answers grounded directly in this document</p>
                </div>
                <button onclick="closeDocAiModal()" class="text-white/80 hover:text-white text-2xl leading-none">&times;</button>
            </div>

            <div id="docChatHistory" class="flex-1 overflow-y-auto p-6 space-y-4 bg-slate-50/70"></div>

            <div class="p-4 bg-white border-t border-slate-200">
                <form onsubmit="handleDocAsk(event)" class="flex items-center gap-2">
                    <input type="text" id="docQuestionInput" placeholder="Ask a question about this PDF..."
                        class="flex-1 px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                    <button type="submit" id="docAskBtn"
                        class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2.5 rounded-xl text-sm transition">
                        Send
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        let allNotes = [];
        let activeFolderKey = null;
        let activeNoteId = null;
        let lastDocQuestion = "";
        let lastBotQuestion = "";

        async function fetchNotes() {
            try {
                const res = await fetch('/api/notes');
                allNotes = await res.json();
                populateFolderDatalist();
                renderCurrentView();
            } catch (err) {
                document.getElementById('notesGrid').innerHTML =
                    `<div class="col-span-full text-center py-12 text-red-500 text-sm">Failed to load notes.</div>`;
            }
        }

        function normalizeFolderName(subject) {
            return String(subject || 'Uncategorized').trim();
        }

        function formatSemBadge(sem) {
            if (!sem) return '';
            const clean = String(sem).replace(/^sem\s*/i, '').trim();
            return `SEM ${clean}`;
        }

        function populateFolderDatalist() {
            const datalist = document.getElementById('existingFoldersList');
            const seen = new Set();
            const options = [];
            allNotes.forEach(n => {
                const name = normalizeFolderName(n.subject);
                const key = name.toLowerCase();
                if (!seen.has(key)) {
                    seen.add(key);
                    options.push(`<option value="${escapeHtml(name)}">`);
                }
            });
            if (!seen.has('previous year papers')) {
                options.push(`<option value="Previous Year Papers">`);
            }
            datalist.innerHTML = options.join('');
        }

        function openFolder(folderKey) {
            activeFolderKey = folderKey;
            document.getElementById('searchInput').value = '';
            renderCurrentView();
        }

        function exitFolder() {
            activeFolderKey = null;
            document.getElementById('searchInput').value = '';
            renderCurrentView();
        }

        function renderCurrentView() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const sem = document.getElementById('semesterFilter').value;
            const breadcrumb = document.getElementById('folderBreadcrumb');

            const semFiltered = allNotes.filter(n => {
                const noteSem = String(n.semester || '').replace(/^sem\s*/i, '').trim();
                return sem === 'ALL' || noteSem === sem;
            });

            if (activeFolderKey !== null) {
                const folderNotes = semFiltered.filter(n => {
                    const key = normalizeFolderName(n.subject).toLowerCase();
                    const matchesFolder = key === activeFolderKey;
                    const matchesQuery = !query ||
                        (n.title || '').toLowerCase().includes(query) ||
                        (n.category || '').toLowerCase().includes(query);
                    return matchesFolder && matchesQuery;
                });

                const displayTitle = folderNotes[0]
                    ? normalizeFolderName(folderNotes[0].subject)
                    : activeFolderKey.toUpperCase();

                breadcrumb.classList.remove('hidden');
                breadcrumb.classList.add('flex');
                document.getElementById('activeFolderTitle').textContent = displayTitle;
                document.getElementById('activeFolderCount').textContent =
                    `${folderNotes.length} ${folderNotes.length === 1 ? 'File' : 'Files'}`;

                renderNoteCards(folderNotes);
                return;
            }

            if (query) {
                breadcrumb.classList.add('hidden');
                breadcrumb.classList.remove('flex');

                const matchedNotes = semFiltered.filter(n =>
                    (n.title || '').toLowerCase().includes(query) ||
                    (n.subject || '').toLowerCase().includes(query) ||
                    (n.category || '').toLowerCase().includes(query)
                );
                renderNoteCards(matchedNotes);
                return;
            }

            breadcrumb.classList.add('hidden');
            breadcrumb.classList.remove('flex');
            renderFolders(semFiltered);
        }

        function renderFolders(notesList) {
            const grid = document.getElementById('notesGrid');
            if (!notesList.length) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-sm">No folders found matching your filter.</div>`;
                return;
            }

            const folderMap = new Map();
            notesList.forEach(note => {
                const rawName = normalizeFolderName(note.subject);
                const key = rawName.toLowerCase();
                if (!folderMap.has(key)) {
                    folderMap.set(key, {
                        key: key,
                        displayName: rawName.toUpperCase(),
                        notes: [],
                        sems: new Set()
                    });
                }
                const entry = folderMap.get(key);
                entry.notes.push(note);
                if (note.semester) {
                    entry.sems.add(formatSemBadge(note.semester));
                }
            });

            const folders = Array.from(folderMap.values());

            grid.innerHTML = folders.map(folder => {
                const semList = Array.from(folder.sems).join(', ') || 'ALL SEMS';
                const count = folder.notes.length;
                const previewTitles = folder.notes
                    .slice(0, 2)
                    .map(n => escapeHtml(n.title))
                    .join(' • ');

                return `
                    <div onclick="openFolder('${escapeHtml(folder.key).replace(/'/g, "\\'")}')"
                        class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm hover:shadow-md hover:border-indigo-300 transition cursor-pointer flex flex-col justify-between group">
                        <div>
                            <div class="flex items-center justify-between gap-2 mb-3">
                                <span class="px-2.5 py-0.5 bg-indigo-50 text-indigo-700 text-[11px] font-bold uppercase tracking-wide rounded-md">
                                    FOLDER
                                </span>
                                <span class="px-2.5 py-0.5 bg-amber-50 text-amber-700 text-[11px] font-bold uppercase tracking-wide rounded-md">
                                    ${escapeHtml(semList)}
                                </span>
                            </div>
                            <div class="flex items-center gap-2.5 mb-1.5">
                                <span class="text-2xl">📁</span>
                                <h3 class="font-bold text-slate-900 text-base group-hover:text-indigo-700 transition line-clamp-1">
                                    ${escapeHtml(folder.displayName)}
                                </h3>
                            </div>
                            <p class="text-xs text-slate-500 line-clamp-1 mb-4">
                                ${previewTitles}
                            </p>
                        </div>
                        <div class="pt-2">
                            <div class="w-full bg-indigo-50/70 group-hover:bg-indigo-100 text-indigo-700 border border-indigo-200 font-semibold py-2 rounded-xl text-xs transition flex items-center justify-center gap-1.5">
                                <span>Open Folder (${count} ${count === 1 ? 'PDF' : 'PDFs'})</span>
                                <span>&rarr;</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderNoteCards(notes) {
            const grid = document.getElementById('notesGrid');
            if (!notes.length) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-sm">No PDFs found in this folder.</div>`;
                return;
            }

            const sortedNotes = [...notes].sort((a, b) =>
                (a.title || '').localeCompare(b.title || '', undefined, { numeric: true, sensitivity: 'base' })
            );

            grid.innerHTML = sortedNotes.map(note => `
                <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                    <div>
                        <div class="flex items-center gap-2 mb-3">
                            <span class="px-2.5 py-0.5 bg-indigo-50 text-indigo-700 text-[11px] font-bold uppercase tracking-wide rounded-md">
                                ${escapeHtml(note.category || 'NOTES')}
                            </span>
                            <span class="px-2.5 py-0.5 bg-amber-50 text-amber-700 text-[11px] font-bold uppercase tracking-wide rounded-md">
                                ${escapeHtml(formatSemBadge(note.semester))}
                            </span>
                        </div>
                        <h3 class="font-bold text-slate-900 text-base mb-1 line-clamp-2">${escapeHtml(note.title)}</h3>
                        <p class="text-xs text-slate-500 mb-4">${escapeHtml(note.subject)}</p>
                    </div>
                    <div class="space-y-2.5 pt-2">
                        <button onclick="openDocAiModal(${note.id}, '${escapeHtml(note.title).replace(/'/g, "\\'")}')"
                            class="w-full bg-indigo-50/70 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 font-semibold py-2 rounded-xl text-xs transition flex items-center justify-center gap-1.5">
                            <span>✨</span> Ask AI About This PDF
                        </button>
                        <div class="grid grid-cols-3 gap-2">
                            <a href="/api/notes/${note.id}/download" target="_blank"
                                class="bg-white hover:bg-slate-50 text-slate-700 font-medium py-2 rounded-xl text-xs transition flex items-center justify-center border border-slate-200">
                                Download
                            </a>
                            <button onclick="openEditModal(${note.id})"
                                class="bg-white hover:bg-indigo-50 text-indigo-600 font-medium py-2 rounded-xl text-xs transition flex items-center justify-center border border-slate-200">
                                Edit
                            </button>
                            <button onclick="deleteNote(${note.id})"
                                class="bg-white hover:bg-red-50 text-red-500 font-medium py-2 rounded-xl text-xs transition flex items-center justify-center border border-slate-200">
                                Delete
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Upload Modal Controls
        function openUploadModal() {
            if (activeFolderKey) {
                const match = allNotes.find(n => normalizeFolderName(n.subject).toLowerCase() === activeFolderKey);
                document.getElementById('uploadSubjectInput').value = match ? normalizeFolderName(match.subject) : activeFolderKey.toUpperCase();
            }
            document.getElementById('uploadModal').classList.remove('hidden');
            document.getElementById('uploadModal').classList.add('flex');
        }

        function closeUploadModal() {
            document.getElementById('uploadModal').classList.add('hidden');
            document.getElementById('uploadModal').classList.remove('flex');
            document.getElementById('uploadStatus').classList.add('hidden');
        }

        async function handleUpload(e) {
            e.preventDefault();
            const form = e.target;
            const btn = document.getElementById('uploadSubmitBtn');
            const statusDiv = document.getElementById('uploadStatus');

            btn.disabled = true;
            btn.textContent = 'Uploading...';
            statusDiv.classList.add('hidden');

            try {
                const formData = new FormData(form);
                const uploadedSubject = normalizeFolderName(formData.get('subject')).toLowerCase();

                const res = await fetch('/api/notes/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Upload failed');

                form.reset();
                closeUploadModal();

                document.getElementById('semesterFilter').value = 'ALL';
                activeFolderKey = uploadedSubject;
                await fetchNotes();
            } catch (err) {
                statusDiv.textContent = err.message;
                statusDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Upload PDF';
            }
        }

        // Edit Modal Controls
        function openEditModal(noteId) {
            const note = allNotes.find(n => n.id === noteId);
            if (!note) return;

            document.getElementById('editNoteId').value = note.id;
            document.getElementById('editTitle').value = note.title || '';
            document.getElementById('editSubject').value = note.subject || '';

            const cleanSem = String(note.semester || '5').replace(/^sem\s*/i, '').trim();
            document.getElementById('editSemester').value = cleanSem;

            const normalizedCategory = (note.category || 'NOTES').toUpperCase();
            document.getElementById('editCategory').value = normalizedCategory;

            document.getElementById('editAdminKey').value = '';
            document.getElementById('editStatus').classList.add('hidden');

            document.getElementById('editModal').classList.remove('hidden');
            document.getElementById('editModal').classList.add('flex');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
            document.getElementById('editModal').classList.remove('flex');
            document.getElementById('editStatus').classList.add('hidden');
        }

        async function handleEditSubmit(e) {
            e.preventDefault();
            const noteId = document.getElementById('editNoteId').value;
            const title = document.getElementById('editTitle').value.trim();
            const subject = document.getElementById('editSubject').value.trim();
            const semester = document.getElementById('editSemester').value;
            const category = document.getElementById('editCategory').value;
            const adminKey = document.getElementById('editAdminKey').value;

            const btn = document.getElementById('editSubmitBtn');
            const statusDiv = document.getElementById('editStatus');

            btn.disabled = true;
            btn.textContent = 'Saving...';
            statusDiv.classList.add('hidden');

            try {
                const res = await fetch(`/api/notes/${noteId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Key': adminKey
                    },
                    body: JSON.stringify({
                        title: title,
                        subject: subject,
                        semester: semester,
                        category: category
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Update failed');

                closeEditModal();
                await fetchNotes();
            } catch (err) {
                statusDiv.textContent = err.message;
                statusDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Save Changes';
            }
        }

        async function deleteNote(noteId) {
            const passkey = prompt('Enter Admin Passkey to delete this note:');
            if (!passkey) return;

            try {
                const res = await fetch(`/api/notes/${noteId}`, {
                    method: 'DELETE',
                    headers: { 'X-Admin-Key': passkey }
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Delete failed');
                await fetchNotes();
            } catch (err) {
                alert(err.message);
            }
        }

        // Document AI Modal Controls
        function openDocAiModal(noteId, title) {
            activeNoteId = noteId;
            document.getElementById('docAiTitle').textContent = title;
            document.getElementById('docChatHistory').innerHTML = `
                <div class="bg-white border border-slate-200 rounded-xl p-4 text-sm text-slate-600 shadow-sm">
                    Ask any question about <strong>${escapeHtml(title)}</strong>!
                </div>
            `;
            document.getElementById('docAiModal').classList.remove('hidden');
            document.getElementById('docAiModal').classList.add('flex');
            document.getElementById('docQuestionInput').focus();
        }

        function closeDocAiModal() {
            document.getElementById('docAiModal').classList.add('hidden');
            document.getElementById('docAiModal').classList.remove('flex');
        }

        async function handleDocAsk(e, retryText = null) {
            if (e) e.preventDefault();
            const input = document.getElementById('docQuestionInput');
            const question = retryText || input.value.trim();
            if (!question || !activeNoteId) return;

            lastDocQuestion = question;
            const history = document.getElementById('docChatHistory');
            const btn = document.getElementById('docAskBtn');

            if (!retryText) {
                input.value = '';
                history.innerHTML += `
                    <div class="flex justify-end">
                        <div class="bg-indigo-600 text-white rounded-2xl px-4 py-2.5 text-sm max-w-[80%] shadow-sm">
                            ${escapeHtml(question)}
                        </div>
                    </div>
                `;
            }

            const loaderId = 'loader-' + Date.now();
            history.innerHTML += `
                <div id="${loaderId}" class="flex justify-start">
                    <div class="bg-white border border-slate-200 rounded-2xl px-4 py-2.5 text-sm text-slate-500 shadow-sm">
                        Analyzing PDF...
                    </div>
                </div>
            `;
            history.scrollTop = history.scrollHeight;
            btn.disabled = true;

            try {
                const res = await fetch('/api/ai/doc-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        note_id: activeNoteId,
                        question: question
                    })
                });
                const rawText = await res.text();
                let data;
                try {
                    data = JSON.parse(rawText);
                } catch {
                    throw new Error(`Server error (${res.status})`);
                }

                if (!res.ok) throw new Error(data.detail || 'AI inference failed');

                document.getElementById(loaderId).outerHTML = `
                    <div class="flex justify-start">
                        <div class="bg-white border border-slate-200 rounded-2xl px-4 py-3.5 text-sm text-slate-800 max-w-[92%] shadow-sm markdown-body overflow-x-auto">
                            ${marked.parse(cleanMathSymbols(data.response))}
                        </div>
                    </div>
                `;
            } catch (err) {
                document.getElementById(loaderId).outerHTML = `
                    <div class="flex justify-start">
                        <div class="bg-red-50 border border-red-200 rounded-xl px-4 py-3 text-xs text-red-700 flex items-center justify-between gap-3 w-full">
                            <span>⚠️ <strong>Failed:</strong> ${escapeHtml(err.message)}</span>
                            <button onclick="this.closest('.flex').remove(); handleDocAsk(null, lastDocQuestion);"
                                class="bg-red-600 hover:bg-red-700 text-white font-semibold px-3 py-1 rounded-lg shrink-0">
                                🔄 Retry
                            </button>
                        </div>
                    </div>
                `;
            } finally {
                btn.disabled = false;
                history.scrollTop = history.scrollHeight;
            }
        }

        // Docked StudyBot Drawer Controls
        function toggleStudyBot() {
            const drawer = document.getElementById('studyBotDrawer');
            if (drawer.classList.contains('hidden')) {
                drawer.classList.remove('hidden');
                drawer.classList.add('flex');
                document.getElementById('botQuestionInput').focus();
            } else {
                drawer.classList.add('hidden');
                drawer.classList.remove('flex');
            }
        }

        async function handleBotAsk(e, retryText = null) {
            if (e) e.preventDefault();
            const input = document.getElementById('botQuestionInput');
            const message = retryText || input.value.trim();
            if (!message) return;

            lastBotQuestion = message;
            const history = document.getElementById('botChatHistory');
            const btn = document.getElementById('botAskBtn');

            if (!retryText) {
                input.value = '';
                history.innerHTML += `
                    <div class="flex justify-end">
                        <div class="bg-indigo-600 text-white rounded-xl px-3.5 py-2 text-sm max-w-[85%] shadow-sm">
                            ${escapeHtml(message)}
                        </div>
                    </div>
                `;
            }

            const loaderId = 'bot-loader-' + Date.now();
            history.innerHTML += `
                <div id="${loaderId}" class="flex justify-start">
                    <div class="bg-white border border-slate-200 rounded-xl px-3.5 py-2 text-sm text-slate-500 shadow-sm">
                        Thinking...
                    </div>
                </div>
            `;
            history.scrollTop = history.scrollHeight;
            btn.disabled = true;

            try {
                const res = await fetch('/api/ai/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const rawText = await res.text();
                let data;
                try {
                    data = JSON.parse(rawText);
                } catch {
                    throw new Error(`Server error (${res.status})`);
                }

                if (!res.ok) throw new Error(data.detail || 'StudyBot inference failed');

                document.getElementById(loaderId).outerHTML = `
                    <div class="flex justify-start w-full">
                        <div class="bg-white border border-slate-200 rounded-xl px-4 py-3 text-sm text-slate-800 w-full shadow-sm markdown-body overflow-x-auto">
                            ${marked.parse(cleanMathSymbols(data.response))}
                        </div>
                    </div>
                `;
            } catch (err) {
                document.getElementById(loaderId).outerHTML = `
                    <div class="flex justify-start w-full">
                        <div class="bg-red-50 border border-red-200 rounded-xl px-3 py-2.5 text-xs text-red-700 flex items-center justify-between gap-2 w-full">
                            <span>⚠️ <strong>Failed:</strong> ${escapeHtml(err.message)}</span>
                            <button onclick="this.closest('.flex').remove(); handleBotAsk(null, lastBotQuestion);"
                                class="bg-red-600 hover:bg-red-700 text-white font-semibold px-2.5 py-1 rounded-lg shrink-0">
                                🔄 Retry
                            </button>
                        </div>
                    </div>
                `;
            } finally {
                btn.disabled = false;
                history.scrollTop = history.scrollHeight;
            }
        }

        function cleanMathSymbols(text) {
            const replacements = [
                [/\\Sigma/g, 'Σ'],
                [/\\delta/g, 'δ'],
                [/\\Delta/g, 'Δ'],
                [/\\epsilon|\\varepsilon/g, 'ε'],
                [/\\lambda/g, 'λ'],
                [/\\rightarrow|\\to/g, '→'],
                [/\\Rightarrow/g, '⇒'],
                [/\\leftrightarrow/g, '↔'],
                [/\\times/g, '×'],
                [/\\in\b/g, '∈'],
                [/\\notin\b/g, '∉'],
                [/\\subseteq/g, '⊆'],
                [/\\subset/g, '⊂'],
                [/\\cup/g, '∪'],
                [/\\cap/g, '∩'],
                [/\\emptyset/g, '∅'],
                [/\\neq/g, '≠'],
                [/\\leq/g, '≤'],
                [/\\geq/g, '≥'],
                [/\\forall/g, '∀'],
                [/\\exists/g, '∃'],
                [/q_0/g, 'q₀'],
                [/q_1/g, 'q₁'],
                [/q_2/g, 'q₂'],
                [/\\\(|\\\)/g, ''],
                [/\\\[|\\\]/g, '']
            ];
            let cleaned = String(text);
            for (const [pattern, symbol] of replacements) {
                cleaned = cleaned.replace(pattern, symbol);
            }
            return cleaned;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        fetchNotes();
    </script>
</body>
