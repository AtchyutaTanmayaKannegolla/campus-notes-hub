<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Notes Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .markdown-body ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 0.5rem; }
    .markdown-body ol { list-style-type: decimal; margin-left: 1.5rem; margin-bottom: 0.5rem; }
    .markdown-body p { margin-bottom: 0.5rem; }
    .markdown-body code { background-color: #f3f4f6; padding: 0.15rem 0.3rem; border-radius: 0.25rem; font-family: monospace; }
    .markdown-body pre { background-color: #1f2937; color: #f9fafb; padding: 0.75rem; border-radius: 0.375rem; overflow-x: auto; margin-bottom: 0.5rem; }
    .markdown-body pre code { background-color: transparent; color: inherit; padding: 0; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-book-bookmark text-2xl text-indigo-600"></i>
        <h1 class="text-xl font-bold tracking-tight text-gray-900">Campus Notes Hub</h1>
      </div>
      <button onclick="openUploadModal()" class="inline-flex items-center px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-lg shadow-sm transition">
        <i class="fa-solid fa-plus mr-2"></i> Upload Material
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
    <!-- Filter Bar -->
    <div class="flex flex-col sm:flex-row gap-4 mb-8">
      <div class="relative flex-grow">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400"></i>
        <input type="text" id="searchInput" oninput="renderNotes()" placeholder="Search by title or subject..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
      </div>
      <select id="semesterFilter" onchange="renderNotes()" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white sm:w-48">
        <option value="">All Semesters</option>
        <option value="1">Semester 1</option>
        <option value="2">Semester 2</option>
        <option value="3">Semester 3</option>
        <option value="4">Semester 4</option>
        <option value="5">Semester 5</option>
        <option value="6">Semester 6</option>
        <option value="7">Semester 7</option>
        <option value="8">Semester 8</option>
      </select>
    </div>

    <!-- Notes Grid -->
    <div id="notesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <!-- Floating StudyBot Launcher -->
  <button onclick="openStudyBotModal()" class="fixed bottom-6 right-6 px-4 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full shadow-lg flex items-center space-x-2 z-40 transition cursor-pointer">
    <i class="fa-solid fa-wand-magic-sparkles"></i>
    <span class="font-medium text-sm">Ask StudyBot</span>
  </button>

  <!-- Doc AI Modal -->
  <div id="docModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-2xl w-full h-[85vh] flex flex-col shadow-2xl overflow-hidden">
      <!-- Modal Header -->
      <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between bg-gray-50">
        <div>
          <h3 id="docModalTitle" class="text-lg font-bold text-gray-900">AI: Document Assistant</h3>
          <p id="docModalSubtitle" class="text-xs text-gray-500">Ask questions directly from notes or paste a screenshot</p>
        </div>
        <button onclick="closeDocModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold p-1">&times;</button>
      </div>

      <!-- Messages Area -->
      <div id="docChatMessages" class="flex-grow overflow-y-auto p-6 space-y-4 text-sm"></div>

      <!-- Screenshot Preview Area -->
      <div id="docImagePreviewBox" class="hidden px-6 py-2 bg-indigo-50 border-t border-indigo-100 flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <img id="docImagePreview" class="h-12 w-12 object-cover rounded border border-indigo-200" src="" alt="Screenshot Preview">
          <span class="text-xs font-semibold text-indigo-800">Screenshot attached (Ctrl+V)</span>
        </div>
        <button type="button" onclick="clearDocImage()" class="text-xs text-red-600 hover:text-red-800 font-bold px-2 py-1 bg-white rounded border border-red-200">Remove</button>
      </div>

      <!-- Input Bar -->
      <div class="p-4 border-t border-gray-200 bg-white">
        <form onsubmit="handleDocChatSubmit(event)" class="flex items-center space-x-2">
          <label class="p-2 text-gray-500 hover:text-indigo-600 rounded-lg hover:bg-gray-100 cursor-pointer" title="Attach Image">
            <i class="fa-solid fa-camera text-lg"></i>
            <input type="file" id="docFileInput" accept="image/*" class="hidden" onchange="handleDocFileSelect(event)">
          </label>
          <input type="text" id="docChatInput" placeholder="Ask question or paste screenshot (Ctrl+V)..." class="flex-grow px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
          <button type="submit" id="docSendBtn" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-lg transition">Ask</button>
        </form>
      </div>
    </div>
  </div>

  <!-- StudyBot General Chat Modal -->
  <div id="studyBotModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-2xl w-full h-[85vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between bg-gray-50">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-graduation-cap text-indigo-600 text-lg"></i>
          <h3 class="text-lg font-bold text-gray-900">Campus StudyBot</h3>
        </div>
        <button onclick="closeStudyBotModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold p-1">&times;</button>
      </div>

      <div id="studyBotMessages" class="flex-grow overflow-y-auto p-6 space-y-4 text-sm"></div>

      <div id="studyBotImagePreviewBox" class="hidden px-6 py-2 bg-indigo-50 border-t border-indigo-100 flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <img id="studyBotImagePreview" class="h-12 w-12 object-cover rounded border border-indigo-200" src="" alt="Screenshot Preview">
          <span class="text-xs font-semibold text-indigo-800">Screenshot attached (Ctrl+V)</span>
        </div>
        <button type="button" onclick="clearStudyBotImage()" class="text-xs text-red-600 hover:text-red-800 font-bold px-2 py-1 bg-white rounded border border-red-200">Remove</button>
      </div>

      <div class="p-4 border-t border-gray-200 bg-white">
        <form onsubmit="handleStudyBotSubmit(event)" class="flex items-center space-x-2">
          <label class="p-2 text-gray-500 hover:text-indigo-600 rounded-lg hover:bg-gray-100 cursor-pointer" title="Attach Image">
            <i class="fa-solid fa-camera text-lg"></i>
            <input type="file" id="studyBotFileInput" accept="image/*" class="hidden" onchange="handleStudyBotFileSelect(event)">
          </label>
          <input type="text" id="studyBotInput" placeholder="Ask StudyBot or paste diagram (Ctrl+V)..." class="flex-grow px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
          <button type="submit" id="studyBotSendBtn" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-lg transition">Ask</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Upload Note Modal -->
  <div id="uploadModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-lg w-full p-6 shadow-2xl">
      <div class="flex items-center justify-between mb-4 border-b pb-3">
        <h3 class="text-lg font-bold text-gray-900">Upload Academic Material</h3>
        <button onclick="closeUploadModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
      </div>
      <form onsubmit="handleUploadSubmit(event)" class="space-y-4 text-sm">
        <div>
          <label class="block font-medium text-gray-700 mb-1">Title</label>
          <input type="text" id="uploadTitle" required placeholder="e.g., unit 1" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block font-medium text-gray-700 mb-1">Subject</label>
          <input type="text" id="uploadSubject" required placeholder="e.g., DWDM" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-gray-700 mb-1">Semester</label>
            <input type="text" id="uploadSemester" required placeholder="e.g., 5" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
          <div>
            <label class="block font-medium text-gray-700 mb-1">Category</label>
            <select id="uploadCategory" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              <option value="Notes">Notes</option>
              <option value="Question Bank">Question Bank</option>
              <option value="Syllabus">Syllabus</option>
              <option value="Lab Manual">Lab Manual</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block font-medium text-gray-700 mb-1">PDF File</label>
          <input type="file" id="uploadFile" accept="application/pdf" required class="w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
        </div>
        <div>
          <label class="block font-medium text-gray-700 mb-1">Admin Passkey</label>
          <input type="password" id="uploadAdminKey" required placeholder="Enter upload passkey" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="closeUploadModal()" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-100 transition">Cancel</button>
          <button type="submit" id="uploadSubmitBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg transition">Upload Note</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let allNotes = [];
    let currentNoteId = null;
    let docImageBase64 = null;
    let studyBotImageBase64 = null;

    let lastDocRequest = null;
    let lastStudyBotRequest = null;

    window.addEventListener("DOMContentLoaded", fetchNotes);

    async function fetchNotes() {
      try {
        const res = await fetch("/api/notes");
        allNotes = await res.json();
        renderNotes();
      } catch (err) {
        console.error("Failed to fetch notes:", err);
      }
    }

    function renderNotes() {
      const search = document.getElementById("searchInput").value.toLowerCase();
      const sem = document.getElementById("semesterFilter").value;
      const grid = document.getElementById("notesGrid");
      grid.innerHTML = "";

      const filtered = allNotes.filter(n => {
        const matchesSearch = (n.title || "").toLowerCase().includes(search) || (n.subject || "").toLowerCase().includes(search);
        const matchesSem = !sem || String(n.semester).includes(sem);
        return matchesSearch && matchesSem;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-12 text-center text-gray-400">No notes found matching your criteria.</div>`;
        return;
      }

      filtered.forEach(note => {
        const card = document.createElement("div");
        card.className = "bg-white p-5 rounded-xl border border-gray-200 shadow-sm hover:shadow-md transition flex flex-col justify-between";
        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-semibold px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-full">${note.category || 'Notes'}</span>
              <span class="text-xs font-bold px-2 py-0.5 bg-amber-100 text-amber-800 rounded">Sem ${note.semester}</span>
            </div>
            <h4 class="text-base font-bold text-gray-900">${note.title}</h4>
            <p class="text-xs text-gray-500 mb-4">${note.subject}</p>
          </div>
          <div class="pt-4 border-t border-gray-100 space-y-2">
            <button onclick="openDocModal(${note.id}, '${note.title.replace(/'/g, "\\'")}')" class="w-full py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-semibold rounded-lg flex items-center justify-center space-x-2 transition">
              <i class="fa-solid fa-wand-magic-sparkles"></i>
              <span>Ask AI About This Note</span>
            </button>
            <div class="flex items-center space-x-2">
              <a href="/api/notes/${note.id}/download" target="_blank" class="flex-grow py-2 border border-gray-300 hover:bg-gray-50 text-gray-700 text-xs font-medium rounded-lg text-center transition">
                Download
              </a>
              <button onclick="promptDeleteNote(${note.id})" class="p-2 border border-red-200 text-red-600 hover:bg-red-50 rounded-lg text-xs transition" title="Delete Note">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openUploadModal() { document.getElementById("uploadModal").classList.remove("hidden"); }
    function closeUploadModal() { document.getElementById("uploadModal").classList.add("hidden"); }

    function openStudyBotModal() {
      document.getElementById("studyBotModal").classList.remove("hidden");
      const box = document.getElementById("studyBotMessages");
      if (box.children.length === 0) {
        box.innerHTML = `<div class="p-3 bg-gray-100 rounded-lg text-gray-700 text-xs">Hi! I'm Campus StudyBot. Ask me any engineering concept or paste a diagram (Ctrl+V)!</div>`;
      }
    }
    function closeStudyBotModal() { document.getElementById("studyBotModal").classList.add("hidden"); }

    function openDocModal(noteId, title) {
      currentNoteId = noteId;
      document.getElementById("docModalTitle").innerText = `AI: ${title}`;
      const box = document.getElementById("docChatMessages");
      box.innerHTML = `<div class="p-3 bg-gray-100 rounded-lg text-gray-700 text-xs">Ask questions directly about <strong>${title}</strong>, or paste a screenshot (Ctrl+V)!</div>`;
      clearDocImage();
      document.getElementById("docModal").classList.remove("hidden");
    }
    function closeDocModal() { document.getElementById("docModal").classList.add("hidden"); }

    async function handleUploadSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById("uploadSubmitBtn");
      btn.disabled = true;
      btn.innerText = "Uploading...";

      const formData = new FormData();
      formData.append("title", document.getElementById("uploadTitle").value.trim());
      formData.append("subject", document.getElementById("uploadSubject").value.trim());
      formData.append("semester", document.getElementById("uploadSemester").value.trim());
      formData.append("category", document.getElementById("uploadCategory").value);
      formData.append("file", document.getElementById("uploadFile").files[0]);
      formData.append("admin_key", document.getElementById("uploadAdminKey").value.trim());

      try {
        const res = await fetch("/api/notes/upload", { method: "POST", body: formData });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Upload failed");
        closeUploadModal();
        fetchNotes();
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Upload Note";
      }
    }

    async function promptDeleteNote(noteId) {
      const passkey = prompt("Enter Admin Passkey to delete this note:");
      if (!passkey) return;

      try {
        const res = await fetch(`/api/notes/${noteId}`, {
          method: "DELETE",
          headers: { "x-admin-key": passkey.trim() }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Deletion failed");
        fetchNotes();
      } catch (err) {
        alert(err.message);
      }
    }

    window.addEventListener("paste", (e) => {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (let item of items) {
        if (item.type.indexOf("image") === 0) {
          const blob = item.getAsFile();
          const reader = new FileReader();
          reader.onload = (event) => {
            const base64 = event.target.result;
            if (!document.getElementById("docModal").classList.contains("hidden")) {
              setDocImage(base64);
            } else if (!document.getElementById("studyBotModal").classList.contains("hidden")) {
              setStudyBotImage(base64);
            }
          };
          reader.readAsDataURL(blob);
        }
      }
    });

    function handleDocFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => setDocImage(evt.target.result);
      reader.readAsDataURL(file);
    }
    function setDocImage(base64) {
      docImageBase64 = base64;
      document.getElementById("docImagePreview").src = base64;
      document.getElementById("docImagePreviewBox").classList.remove("hidden");
    }
    function clearDocImage() {
      docImageBase64 = null;
      document.getElementById("docFileInput").value = "";
      document.getElementById("docImagePreview").src = "";
      document.getElementById("docImagePreviewBox").classList.add("hidden");
    }

    function handleStudyBotFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => setStudyBotImage(evt.target.result);
      reader.readAsDataURL(file);
    }
    function setStudyBotImage(base64) {
      studyBotImageBase64 = base64;
      document.getElementById("studyBotImagePreview").src = base64;
      document.getElementById("studyBotImagePreviewBox").classList.remove("hidden");
    }
    function clearStudyBotImage() {
      studyBotImageBase64 = null;
      document.getElementById("studyBotFileInput").value = "";
      document.getElementById("studyBotImagePreview").src = "";
      document.getElementById("studyBotImagePreviewBox").classList.add("hidden");
    }

    async function handleDocChatSubmit(e) {
      if (e) e.preventDefault();
      const input = document.getElementById("docChatInput");
      const text = input.value.trim();
      const image = docImageBase64;

      if (!text && !image) return;

      lastDocRequest = { noteId: currentNoteId, question: text, image_base64: image };

      appendMessage("docChatMessages", "user", text, image);
      input.value = "";
      clearDocImage();

      executeDocChat();
    }

    async function executeDocChat() {
      const box = document.getElementById("docChatMessages");
      const btn = document.getElementById("docSendBtn");
      btn.disabled = true;

      const existingError = box.querySelector(".error-retry-card");
      if (existingError) existingError.remove();

      const loader = document.createElement("div");
      loader.id = "docLoader";
      loader.className = "p-3 bg-gray-100 rounded-lg text-xs text-gray-500 animate-pulse";
      loader.innerText = "Analyzing PDF & screenshot...";
      box.appendChild(loader);
      box.scrollTop = box.scrollHeight;

      try {
        const res = await fetch("/api/ai/doc-chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            note_id: lastDocRequest.noteId,
            question: lastDocRequest.question,
            image_base64: lastDocRequest.image_base64
          })
        });

        const data = await res.json().catch(() => ({}));
        
        const activeLoader = document.getElementById("docLoader");
        if (activeLoader) activeLoader.remove();

        if (!res.ok) {
          throw new Error(data.detail || `Server error (${res.status})`);
        }

        appendMessage("docChatMessages", "ai", data.response);

      } catch (err) {
        const activeLoader = document.getElementById("docLoader");
        if (activeLoader) activeLoader.remove();
        renderRetryCard("docChatMessages", err.message, "executeDocChat()");
      } finally {
        btn.disabled = false;
      }
    }

    async function handleStudyBotSubmit(e) {
      if (e) e.preventDefault();
      const input = document.getElementById("studyBotInput");
      const text = input.value.trim();
      const image = studyBotImageBase64;

      if (!text && !image) return;

      lastStudyBotRequest = { message: text, image_base64: image };

      appendMessage("studyBotMessages", "user", text, image);
      input.value = "";
      clearStudyBotImage();

      executeStudyBotChat();
    }

    async function executeStudyBotChat() {
      const box = document.getElementById("studyBotMessages");
      const btn = document.getElementById("studyBotSendBtn");
      btn.disabled = true;

      const existingError = box.querySelector(".error-retry-card");
      if (existingError) existingError.remove();

      const loader = document.createElement("div");
      loader.id = "studyBotLoader";
      loader.className = "p-3 bg-gray-100 rounded-lg text-xs text-gray-500 animate-pulse";
      loader.innerText = "StudyBot is thinking...";
      box.appendChild(loader);
      box.scrollTop = box.scrollHeight;

      try {
        const res = await fetch("/api/ai/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: lastStudyBotRequest.message,
            image_base64: lastStudyBotRequest.image_base64
          })
        });

        const data = await res.json().catch(() => ({}));
        
        const activeLoader = document.getElementById("studyBotLoader");
        if (activeLoader) activeLoader.remove();

        if (!res.ok) {
          throw new Error(data.detail || `Server error (${res.status})`);
        }

        appendMessage("studyBotMessages", "ai", data.response);

      } catch (err) {
        const activeLoader = document.getElementById("studyBotLoader");
        if (activeLoader) activeLoader.remove();
        renderRetryCard("studyBotMessages", err.message, "executeStudyBotChat()");
      } finally {
        btn.disabled = false;
      }
    }

    function appendMessage(containerId, sender, text, image) {
      const box = document.getElementById(containerId);
      const msgDiv = document.createElement("div");
      msgDiv.className = sender === "user" ? "flex justify-end" : "flex justify-start";

      const bubble = document.createElement("div");
      bubble.className = sender === "user"
        ? "max-w-[85%] bg-indigo-600 text-white rounded-2xl rounded-tr-none px-4 py-2.5 shadow-sm space-y-2 text-xs leading-relaxed"
        : "max-w-[90%] bg-gray-100 text-gray-800 rounded-2xl rounded-tl-none px-4 py-3 shadow-sm text-xs markdown-body leading-relaxed";

      if (image) {
        const img = document.createElement("img");
        img.src = image;
        img.className = "max-h-48 rounded-lg border border-white/20 mb-2 object-cover";
        bubble.appendChild(img);
      }

      if (text) {
        if (sender === "user") {
          const p = document.createElement("p");
          p.innerText = text;
          bubble.appendChild(p);
        } else {
          bubble.innerHTML += marked.parse(text);
        }
      }

      msgDiv.appendChild(bubble);
      box.appendChild(msgDiv);
      box.scrollTop = box.scrollHeight;
    }

    function renderRetryCard(containerId, errorMessage, retryFunctionCall) {
      const box = document.getElementById(containerId);
      const card = document.createElement("div");
      card.className = "error-retry-card p-3 bg-red-50 border border-red-200 rounded-xl text-red-700 text-xs flex items-center justify-between gap-3 shadow-sm";
      card.innerHTML = `
        <div class="flex items-center space-x-2 overflow-hidden">
          <i class="fa-solid fa-triangle-exclamation text-red-500 shrink-0"></i>
          <span class="truncate"><strong>Failed:</strong> ${errorMessage}</span>
        </div>
        <button type="button" onclick="${retryFunctionCall}" class="px-3 py-1 bg-red-600 hover:bg-red-700 text-white text-xs font-semibold rounded-lg shrink-0 flex items-center space-x-1 transition shadow-sm">
          <i class="fa-solid fa-rotate-right"></i>
          <span>Retry</span>
        </button>
      `;
      box.appendChild(card);
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
